  <style>
    :root{--bg:#05060b;--glass:rgba(255,255,255,.075);--glass2:rgba(255,255,255,.045);--stroke:rgba(255,255,255,.14);--text:#f7f8ff;--muted:#9ca6bd;--gold:#f7b84b;--blue:#6aa7ff;--brand-purple:#6d28d9;--brand-blue:#2f8fef;--green:#19d18f;--red:#ff5267;--purple:#a977ff;--shadow:0 26px 90px rgba(0,0,0,.42)}*{box-sizing:border-box;min-width:0}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#111a31 0,#05060b 58%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow-x:hidden}body.rtl{direction:rtl}.bg-grid{position:fixed;inset:0;z-index:-2;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:46px 46px;mask-image:radial-gradient(circle,#000 15%,transparent 82%)}.orb{position:fixed;width:430px;height:430px;border-radius:50%;filter:blur(70px);opacity:.28;z-index:-1;animation:float 9s infinite alternate}.orb.one{background:var(--blue);left:8%;top:4%}.orb.two{background:var(--brand-purple);right:4%;bottom:6%;animation-delay:2s}.orb.three{background:var(--purple);left:38%;bottom:14%;opacity:.17;animation-delay:4s}@keyframes float{to{transform:translate3d(35px,-28px,0) scale(1.06)}}.app{width:min(1180px,100%);margin:auto;padding:22px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;border-radius:28px;background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(24px);box-shadow:var(--shadow);margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.brand-logo{width:48px;height:48px;border-radius:17px;background:#fff;display:grid;place-items:center;padding:6px;box-shadow:0 0 35px rgba(47,143,239,.30)}.brand-logo svg{width:100%;height:100%}.brand b{display:block;font-size:18px;letter-spacing:.04em}.brand span,.muted{color:var(--muted);font-size:13px}.btn{border:0;border-radius:16px;padding:12px 15px;background:linear-gradient(135deg,#8b2fe0,#1f7fe0);color:#fff;font-weight:900;cursor:pointer;transition:.22s;box-shadow:0 14px 28px rgba(47,143,239,.22);text-decoration:none;display:inline-flex;justify-content:center;align-items:center;gap:8px}.btn:hover{transform:translateY(-2px) scale(1.01)}.btn.secondary{background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--stroke);box-shadow:none}.btn.green{background:linear-gradient(135deg,#19d18f,#6df3c1);color:#03100b}.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}.layout{display:grid;grid-template-columns:1.05fr .95fr;gap:18px;align-items:start}.panel{border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border:1px solid var(--stroke);box-shadow:var(--shadow);backdrop-filter:blur(24px);padding:20px}h1,h2,h3,p{margin:0}h1{font-size:clamp(28px,5vw,48px);letter-spacing:-.04em}h2{font-size:20px;margin-bottom:12px}.eyebrow{color:var(--brand-blue);font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;margin:0 0 7px}.provider-logo-wrap{width:118px;height:86px;border-radius:24px;background:#fff;display:grid;place-items:center;padding:12px;box-shadow:0 18px 40px rgba(255,255,255,.08)}.provider-logo-wrap img{max-width:100%;max-height:100%;object-fit:contain}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.stat{padding:13px;border-radius:18px;background:rgba(255,255,255,.045);border:1px solid var(--stroke)}.stat small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.stat b{font-size:17px;word-break:break-word}.amount-card{border-radius:28px;padding:22px;background:radial-gradient(circle at top right,rgba(139,47,224,.20),transparent 40%),rgba(0,0,0,.22);border:1px solid var(--stroke);margin-bottom:18px}.amount-row{display:flex;justify-content:space-between;gap:16px;align-items:center}.timer{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;background:rgba(247,184,75,.12);color:#ffd28a;border:1px solid rgba(247,184,75,.24);padding:10px 13px;border-radius:16px;font-weight:950;white-space:nowrap}.action-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.action-tab{padding:12px;border-radius:18px;border:1px solid var(--stroke);background:rgba(255,255,255,.045);color:var(--text);cursor:pointer;text-align:center;transition:.22s;font-weight:800;font-size:13px}.action-tab:hover,.action-tab.active{border-color:rgba(47,143,239,.55);box-shadow:0 0 0 4px rgba(47,143,239,.10);transform:translateY(-2px)}.pay-panel{border-radius:24px;border:1px solid var(--stroke);background:rgba(0,0,0,.22);padding:18px;margin-bottom:16px}.wallet-box{border-radius:20px;padding:16px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.10);margin-top:12px}.wallet-value{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:clamp(22px,5vw,32px);font-weight:950;letter-spacing:.03em;word-break:break-word}.copy-row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}.field label{font-size:12px;color:var(--muted);font-weight:800}.input,select,textarea{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--stroke);border-radius:15px;color:#fff;padding:12px 13px;outline:none;font:inherit}.input:focus,select:focus,textarea:focus{border-color:rgba(47,143,239,.5);box-shadow:0 0 0 4px rgba(47,143,239,.10)}select option{background:#111827;color:#fff}.qr-card{background:#fff;border-radius:22px;padding:14px;display:inline-grid;place-items:center;margin:12px auto}.qr-card img{width:180px;height:180px;object-fit:contain}.ussd-code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:clamp(22px,5vw,32px);font-weight:950;color:#ffd28a;direction:ltr;text-align:center;word-break:break-word;background:rgba(247,184,75,.09);border:1px solid rgba(247,184,75,.2);border-radius:20px;padding:16px;margin-top:12px}.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 10px;background:rgba(25,209,143,.12);color:#8ff1c7;font-size:12px;font-weight:900}.tag.warn{background:rgba(247,184,75,.13);color:#ffd28a}.instructions{color:rgba(255,255,255,.72);line-height:1.8;font-size:14px;margin-top:12px}.submit-wrap{position:sticky;bottom:14px;margin-top:16px}.submit-wrap .btn{width:100%;padding:16px;border-radius:20px;font-size:16px}.state{min-height:360px;display:grid;place-items:center;text-align:center}.loader{width:70px;height:70px;margin:0 auto 22px;border-radius:50%;border:6px solid rgba(255,255,255,.18);border-top-color:var(--brand-blue);animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:rgba(8,10,17,.94);border:1px solid var(--stroke);border-radius:18px;padding:13px 16px;box-shadow:var(--shadow);transition:.25s;z-index:50;max-width:min(520px,calc(100% - 30px));text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.error-box{border-radius:24px;padding:18px;border:1px solid rgba(255,82,103,.25);background:rgba(255,82,103,.08);color:#ffd2d8}@media(max-width:900px){.layout{grid-template-columns:1fr}.topbar{align-items:flex-start}.action-tabs{grid-template-columns:1fr 1fr}}@media(max-width:560px){.app{padding:12px}.topbar{border-radius:22px;padding:14px}.panel{border-radius:24px;padding:15px}.summary{grid-template-columns:1fr}.amount-row{flex-direction:column;align-items:flex-start}.provider-logo-wrap{width:100%}.action-tabs{grid-template-columns:1fr}.copy-row .btn{flex:1}}
  </style>

<body class="rtl">
  <div class="bg-grid"></div><div class="orb one"></div><div class="orb two"></div><div class="orb three"></div>
  <div class="app"><header class="topbar"><div class="brand"><div class="brand-logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b2fe0"/><stop offset="1" stop-color="#5b21b6"/></linearGradient><linearGradient id="bgr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4aa8f7"/><stop offset="1" stop-color="#1f7fe0"/></linearGradient></defs><circle cx="50" cy="50" r="43" fill="none" stroke="url(#pg)" stroke-width="13"/><circle cx="50" cy="50" r="23" fill="none" stroke="url(#bgr)" stroke-width="10"/><circle cx="50" cy="50" r="9.5" fill="url(#bgr)"/></svg></div><div><b>OnTarget Checkout</b><span id="brandSub">دفع مباشر آمن</span></div></div><button class="btn secondary" id="langBtn" type="button">AR / EN</button></header><main id="root"><section class="panel state"><div><div class="loader"></div><h2>Loading checkout...</h2><p class="muted">Please wait</p></div></section></main></div><div id="toast" class="toast"></div>
  <script>
    const API_BASE="https://pay.ontarget-egy.com";const CHECKOUT_BASE="https://checkout.ontarget-egy.com";let currentTx=null;let currentLang=localStorage.getItem("ontarget_lang")||"ar";let selectedPaymentAction="manual";let countdownTimer=null;const root=document.getElementById("root");const langBtn=document.getElementById("langBtn");const t={ar:{securePayment:"دفع مباشر آمن",loading:"جاري تحميل صفحة الدفع...",pleaseWait:"يرجى الانتظار",missingRef:"رقم عملية الدفع غير موجود.",notFound:"لم يتم العثور على العملية.",serverError:"تعذر الاتصال بخادم الدفع.",retry:"إعادة المحاولة",merchant:"التاجر",amount:"المبلغ",reference:"المرجع",transaction:"رقم العملية",method:"طريقة الدفع",expiresIn:"ينتهي خلال",chooseHow:"اختر طريقة الدفع",manual:"تحويل يدوي",qr:"QR",ussd:"USSD",redirect:"فتح التطبيق",walletNumber:"رقم المحفظة / الحساب",accountLabel:"اسم الحساب",copy:"نسخ",copied:"تم النسخ",copyAmount:"نسخ المبلغ",scanQr:"امسح QR للدفع",scanInfo:"امسح بالكاميرا أو تطبيق الدفع المدعوم",copyQr:"نسخ بيانات QR",ussdPay:"الدفع عبر كود USSD",openUssd:"فتح كود USSD",mobileOnly:"كود USSD يعمل من الهاتف فقط.",openApp:"افتح تطبيق الدفع",fallback:"إذا لم يفتح التطبيق، أكمل يدويًا باستخدام رقم المحفظة أو كود USSD.",continueManual:"إكمال الدفع يدويًا",customerInfo:"بيانات تأكيد الدفع",submit:"تم الدفع - إرسال التأكيد",submitting:"جاري الإرسال...",expired:"انتهت صلاحية جلسة الدفع.",submitFailed:"فشل إرسال التأكيد",instructions:"التعليمات",transferExact:"حوّل نفس المبلغ بالضبط ثم اضغط تم الدفع."},en:{securePayment:"Secure live payment",loading:"Loading checkout...",pleaseWait:"Please wait",missingRef:"Missing payment reference.",notFound:"Transaction not found.",serverError:"Could not connect to payment server.",retry:"Retry",merchant:"Merchant",amount:"Amount",reference:"Reference",transaction:"Transaction",method:"Payment Method",expiresIn:"Expires in",chooseHow:"Choose how to pay",manual:"Manual Transfer",qr:"QR",ussd:"USSD",redirect:"Open App",walletNumber:"Wallet / Account Number",accountLabel:"Account Label",copy:"Copy",copied:"Copied",copyAmount:"Copy Amount",scanQr:"Scan QR to pay",scanInfo:"Scan with supported wallet/payment app",copyQr:"Copy QR Payload",ussdPay:"Pay using USSD code",openUssd:"Open USSD",mobileOnly:"USSD can only be opened from a mobile phone.",openApp:"Open Payment App",fallback:"If the app did not open, continue manually using wallet number or USSD.",continueManual:"Continue Manual Payment",customerInfo:"Payment Confirmation Details",submit:"I Paid - Submit Confirmation",submitting:"Submitting...",expired:"This payment session has expired.",submitFailed:"Submit confirmation failed",instructions:"Instructions",transferExact:"Transfer the exact amount, then click I Paid."}};function L(k){return t[currentLang][k]||k}function applyLang(){document.body.classList.toggle("rtl",currentLang==="ar");document.documentElement.dir=currentLang==="ar"?"rtl":"ltr";document.documentElement.lang=currentLang;document.getElementById("brandSub").textContent=L("securePayment");langBtn.textContent=currentLang==="ar"?"EN":"عربي"}langBtn.addEventListener("click",()=>{currentLang=currentLang==="ar"?"en":"ar";localStorage.setItem("ontarget_lang",currentLang);applyLang();if(currentTx)renderCheckout(currentTx)});function getTransactionIdFromUrl(){const p=new URLSearchParams(window.location.search);const q=p.get("txid")||p.get("transaction_id")||p.get("token");if(q)return q.trim();const parts=window.location.pathname.split("/").filter(Boolean);const last=parts[parts.length-1];if(last&&last.toUpperCase().startsWith("TXN-"))return last;return""}function resolveAssetUrl(path){if(!path)return"";if(path.startsWith("http://")||path.startsWith("https://"))return path;return `${API_BASE}${path.startsWith("/")?path:"/"+path}`}function buildWaitingUrl(id){const host=window.location.hostname;const base=host.includes("pay.ontarget-egy.com")?"https://pay.ontarget-egy.com":"https://checkout.ontarget-egy.com";return `${base}/waiting.html?txid=${encodeURIComponent(id)}`}function escapeHtml(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}function showToast(m){const x=document.getElementById("toast");x.textContent=m;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1800)}async function copyText(v){try{await navigator.clipboard.writeText(String(v||""));showToast(L("copied"))}catch{showToast("Copy failed")}}function isMobile(){return/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)}function formatAmount(a,c){const n=Number(a||0);return `${n.toLocaleString(undefined,{maximumFractionDigits:2})} ${c||""}`}function formatTimeLeft(e){if(!e)return"--:--";const end=new Date(e).getTime();const diff=Math.max(0,Math.floor((end-Date.now())/1000));return `${String(Math.floor(diff/60)).padStart(2,"0")}:${String(diff%60).padStart(2,"0")}`}function buildDialUrl(code){if(!code)return"";return"tel:"+encodeURIComponent(code).replace(/%2A/g,"*")}function renderLoading(){root.innerHTML=`<section class="panel state"><div><div class="loader"></div><h2>${escapeHtml(L("loading"))}</h2><p class="muted">${escapeHtml(L("pleaseWait"))}</p></div></section>`}function renderError(message){root.innerHTML=`<section class="panel state"><div class="error-box"><h2>${escapeHtml(message)}</h2><p class="muted" style="margin-top:10px">${escapeHtml(L("serverError"))}</p><button class="btn" style="margin-top:16px" onclick="init()">${escapeHtml(L("retry"))}</button></div></section>`}async function fetchTransaction(txid){const res=await fetch(`${API_BASE}/api/v1/transaction/${encodeURIComponent(txid)}`);if(!res.ok){if(res.status===404)throw new Error(L("notFound"));throw new Error(L("serverError"))}return res.json()}function getAvailableActions(tx){const a=[];if(tx.wallet_number)a.push("manual");if(tx.qr&&tx.qr.enabled)a.push("qr");if(tx.ussd&&tx.ussd.enabled)a.push("ussd");if(tx.redirect&&tx.redirect.enabled&&tx.redirect.url)a.push("redirect");if(!a.length)a.push("manual");return a}function chooseDefaultAction(tx){if(tx.redirect&&tx.redirect.enabled&&tx.redirect.url&&isMobile())return"redirect";if(tx.qr&&tx.qr.enabled)return"qr";if(tx.wallet_number)return"manual";if(tx.ussd&&tx.ussd.enabled)return"ussd";return"manual"}function renderCheckout(tx){currentTx=tx;const logoUrl=resolveAssetUrl(tx.provider_logo);const methodName=currentLang==="ar"?(tx.method_name_ar||tx.method_name||tx.method):(tx.method_name||tx.method_name_ar||tx.method);const instructions=currentLang==="ar"?(tx.instructions_ar||tx.instructions_en||L("transferExact")):(tx.instructions_en||tx.instructions_ar||L("transferExact"));if(!selectedPaymentAction||!getAvailableActions(tx).includes(selectedPaymentAction))selectedPaymentAction=chooseDefaultAction(tx);const availableActions=getAvailableActions(tx);root.innerHTML=`<section class="layout"><aside class="panel"><div class="amount-card"><div class="amount-row"><div><p class="eyebrow">${escapeHtml(L("amount"))}</p><h1>${escapeHtml(formatAmount(tx.amount,tx.currency))}</h1><p class="muted" style="margin-top:8px">${escapeHtml(methodName||"")}</p></div><div><div class="timer" id="countdown">--:--</div></div></div></div><div style="display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:16px"><div><p class="eyebrow">${escapeHtml(L("method"))}</p><h2>${escapeHtml(methodName||"Payment")}</h2>${tx.account_label?`<p class="muted">${escapeHtml(tx.account_label)}</p>`:""}</div><div class="provider-logo-wrap">${logoUrl?`<img src="${escapeHtml(logoUrl)}" alt="${escapeHtml(methodName||"provider")}">`:`<b style="color:#111">${escapeHtml(String(methodName||"Pay").slice(0,2))}</b>`}</div></div><div class="summary"><div class="stat"><small>${escapeHtml(L("merchant"))}</small><b>${escapeHtml(tx.merchant_name||"Merchant")}</b></div><div class="stat"><small>${escapeHtml(L("reference"))}</small><b>${escapeHtml(tx.reference||"-")}</b></div><div class="stat"><small>${escapeHtml(L("transaction"))}</small><b>${escapeHtml(tx.transaction_id||"")}</b></div><div class="stat"><small>${escapeHtml(L("expiresIn"))}</small><b><span class="tag warn" id="countdownSmall">--:--</span></b></div></div><div class="pay-panel"><p class="eyebrow">${escapeHtml(L("instructions"))}</p><p class="instructions">${escapeHtml(instructions)}</p></div></aside><main class="panel"><p class="eyebrow">${escapeHtml(L("chooseHow"))}</p><div class="action-tabs">${availableActions.map(action=>`<button class="action-tab ${selectedPaymentAction===action?"active":""}" type="button" onclick="selectPaymentAction('${action}')">${escapeHtml(L(action))}</button>`).join("")}</div><div id="paymentActionPanel"></div><div class="pay-panel"><h2>${escapeHtml(L("customerInfo"))}</h2><form id="paymentForm"><div id="dynamicFields"></div><div class="submit-wrap"><button class="btn green" id="submitBtn" type="submit">${escapeHtml(L("submit"))}</button></div></form></div></main></section>`;renderPaymentActionPanel();renderDynamicFields(tx.fields||[]);setupForm();setupCountdown(tx.expires_at)}function setupCountdown(expiresAt){clearInterval(countdownTimer);function tick(){const value=formatTimeLeft(expiresAt);const a=document.getElementById("countdown");const b=document.getElementById("countdownSmall");if(a)a.textContent=value;if(b)b.textContent=value}tick();countdownTimer=setInterval(tick,1000)}function selectPaymentAction(action){selectedPaymentAction=action;renderCheckout(currentTx)}function renderPaymentActionPanel(){const box=document.getElementById("paymentActionPanel");if(!box||!currentTx)return;if(selectedPaymentAction==="manual")renderManual(box);else if(selectedPaymentAction==="qr")renderQr(box);else if(selectedPaymentAction==="ussd")renderUssd(box);else if(selectedPaymentAction==="redirect")renderRedirect(box)}function renderManual(box){const tx=currentTx;box.innerHTML=`<div class="pay-panel"><h2>${escapeHtml(L("manual"))}</h2>${tx.account_label?`<p class="muted">${escapeHtml(L("accountLabel"))}: ${escapeHtml(tx.account_label)}</p>`:""}<div class="wallet-box"><p class="muted">${escapeHtml(L("walletNumber"))}</p><div class="wallet-value">${escapeHtml(tx.wallet_number||"-")}</div><div class="copy-row"><button class="btn secondary" type="button" onclick="copyText('${escapeHtml(tx.wallet_number||"")}')">${escapeHtml(L("copy"))}</button><button class="btn secondary" type="button" onclick="copyText('${escapeHtml(tx.amount||"")}')">${escapeHtml(L("copyAmount"))}</button></div></div></div>`}function renderQr(box){const tx=currentTx;const qr=tx.qr||{};const label=currentLang==="ar"?(qr.label_ar||L("scanQr")):(qr.label_en||L("scanQr"));const imageUrl=resolveAssetUrl(qr.image_url||"");box.innerHTML=`<div class="pay-panel" style="text-align:center"><h2>${escapeHtml(label)}</h2><p class="muted">${escapeHtml(L("scanInfo"))}</p><div class="qr-card">${imageUrl?`<img src="${escapeHtml(imageUrl)}" alt="QR">`:`<canvas id="paymentQrCanvas"></canvas>`}</div>${qr.payload?`<div class="copy-row" style="justify-content:center"><button class="btn secondary" type="button" onclick="copyText('${escapeHtml(qr.payload)}')">${escapeHtml(L("copyQr"))}</button></div>`:""}</div>`;if(!imageUrl&&qr.payload&&window.QRCode){QRCode.toCanvas(document.getElementById("paymentQrCanvas"),qr.payload,{width:180,margin:1},error=>{if(error)console.error(error)})}}function renderUssd(box){const tx=currentTx;const ussd=tx.ussd||{};const dialUrl=ussd.dial_url||buildDialUrl(ussd.code||"");const label=currentLang==="ar"?(ussd.label_ar||L("ussdPay")):(ussd.label_en||L("ussdPay"));const instructions=currentLang==="ar"?(ussd.instructions_ar||""):(ussd.instructions_en||"");const mobile=isMobile();box.innerHTML=`<div class="pay-panel"><h2>${escapeHtml(label)}</h2>${instructions?`<p class="muted">${escapeHtml(instructions)}</p>`:""}<div class="ussd-code">${escapeHtml(ussd.code||"-")}</div>${!mobile?`<p class="muted" style="margin-top:10px">${escapeHtml(L("mobileOnly"))}</p>`:""}<div class="copy-row"><button class="btn secondary" type="button" onclick="copyText('${escapeHtml(ussd.code||"")}')">${escapeHtml(L("copy"))}</button><a class="btn ${mobile?"":"secondary"}" ${mobile?`href="${escapeHtml(dialUrl)}"`:`href="javascript:void(0)"`}>${escapeHtml(L("openUssd"))}</a></div></div>`}function renderRedirect(box){const tx=currentTx;const redirect=tx.redirect||{};const btn=currentLang==="ar"?(redirect.button_ar||L("openApp")):(redirect.button_en||L("openApp"));box.innerHTML=`<div class="pay-panel"><h2>${escapeHtml(L("redirect"))}</h2><p class="muted">${escapeHtml(L("fallback"))}</p><div class="copy-row"><button class="btn" type="button" onclick="openPaymentRedirect()">${escapeHtml(btn)}</button><button class="btn secondary" type="button" onclick="selectPaymentAction('manual')">${escapeHtml(L("continueManual"))}</button></div><div id="redirectFallback" style="display:none;margin-top:14px" class="error-box"><p>${escapeHtml(L("fallback"))}</p><button class="btn secondary" style="margin-top:12px" type="button" onclick="selectPaymentAction('manual')">${escapeHtml(L("continueManual"))}</button></div></div>`}function openPaymentRedirect(){if(!currentTx||!currentTx.redirect||!currentTx.redirect.url)return;const url=currentTx.redirect.url;const box=document.getElementById("redirectFallback");const startedAt=Date.now();window.location.href=url;setTimeout(()=>{if(Date.now()-startedAt<2500&&box)box.style.display="block"},1600)}function renderDynamicFields(fields){const box=document.getElementById("dynamicFields");if(!box)return;if(!fields.length){box.innerHTML=`<div class="field"><label>${currentLang==="ar"?"رقم المرسل":"Sender Phone"}</label><input class="input" name="sender_phone" type="tel" placeholder="01xxxxxxxxx" required></div><div class="field"><label>${currentLang==="ar"?"رفع إثبات الدفع":"Upload Payment Proof"}</label><input class="input" name="proof_image" type="file" required></div>`;return}box.innerHTML=fields.map(f=>{const key=escapeHtml(f.key||"");const label=currentLang==="ar"?escapeHtml(f.labelAr||f.label||f.key):escapeHtml(f.label||f.labelAr||f.key);const required=f.required?"required":"";const reqMark=f.required?" *":"";const placeholder=escapeHtml(f.placeholder||"");const type=f.type||"text";if(type==="textarea")return`<div class="field"><label>${label}${reqMark}</label><textarea name="${key}" placeholder="${placeholder}" ${required}></textarea></div>`;if(type==="file")return`<div class="field"><label>${label}${reqMark}</label><input class="input" name="${key}" type="file" ${required}></div>`;if(type==="select"){const opts=Array.isArray(f.options)?f.options:[];if(!opts.length)return`<div class="field"><label>${label}${reqMark}</label><input class="input" name="${key}" type="text" placeholder="${placeholder}" ${required}></div>`;return`<div class="field"><label>${label}${reqMark}</label><select name="${key}" ${required}><option value="">${currentLang==="ar"?"اختر":"Select"}</option>${opts.map(o=>{const value=typeof o==="string"?o:o.value;const text=typeof o==="string"?o:(currentLang==="ar"?(o.labelAr||o.label||o.value):(o.label||o.labelAr||o.value));return`<option value="${escapeHtml(value)}">${escapeHtml(text)}</option>`}).join("")}</select></div>`}const safe=["text","tel","number","email"].includes(type)?type:"text";return`<div class="field"><label>${label}${reqMark}</label><input class="input" name="${key}" type="${safe}" placeholder="${placeholder}" ${required}></div>`}).join("")}function setupForm(){const form=document.getElementById("paymentForm");if(!form)return;form.addEventListener("submit",async e=>{e.preventDefault();if(!currentTx)return;const btn=document.getElementById("submitBtn");btn.disabled=true;btn.textContent=L("submitting");try{const fd=new FormData(form);fd.append("transaction_id",currentTx.transaction_id);fd.append("selected_payment_action",selectedPaymentAction);const res=await fetch(`${API_BASE}/api/v1/transaction/${encodeURIComponent(currentTx.transaction_id)}/paid`,{method:"POST",body:fd});const data=await res.json().catch(()=>({}));if(!res.ok||data.success===false)throw new Error(data.error||data.message||L("submitFailed"));window.location.href=buildWaitingUrl(currentTx.transaction_id)}catch(err){showToast(err.message||L("submitFailed"));btn.disabled=false;btn.textContent=L("submit")}})}async function init(){applyLang();renderLoading();const txid=getTransactionIdFromUrl();if(!txid){renderError(L("missingRef"));return}try{const data=await fetchTransaction(txid);const tx=data.transaction||data.data||data;if(!tx||tx.error)throw new Error(tx.error||L("notFound"));if(tx.status==="expired"){renderError(L("expired"));return}selectedPaymentAction="";renderCheckout(tx)}catch(err){renderError(err.message||L("serverError"))}}init();
  </script>
