name: One-time SMS Assign Button Patch

on:
  push:
    paths:
      - '.github/workflows/patch-sms-assign.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch SmsLive drawer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/pages/SmsLive.tsx")
          s = p.read_text()

          old = """  const closeDetail = () => {
    setSelected(null)
    const next = new URLSearchParams(params)
    next.delete('sms_id')
    setParams(next, { replace: true })
  }

  const link = async (txId: number, confirmAmountMismatch = false) =>"""
          new = """  const closeDetail = () => {
    setSelected(null)
    const next = new URLSearchParams(params)
    next.delete('sms_id')
    setParams(next, { replace: true })
  }

  const scrollToAssignment = () => {
    const target = document.getElementById('sms-assignment-section')
    target?.scrollIntoView({ behavior: 'smooth', block: 'start' })
  }

  const link = async (txId: number, confirmAmountMismatch = false) =>"""
          if old not in s:
              raise SystemExit("closeDetail anchor not found")
          s = s.replace(old, new, 1)

          old = """                <div className="drawer-head">
                  <h3 className="mono">SMS #{selected.id}</h3>
                  <button className="btn-ghost btn-sm" onClick={closeDetail}>✕</button>
                </div>"""
          new = """                <div className="drawer-head">
                  <h3 className="mono">SMS #{selected.id}</h3>
                  <div className="drawer-head-actions">
                    {can('sms_live', 'can_edit') && !selected.is_blocked && (
                      selected.sms_category === 'withdrawal'
                        ? (!selected.matched_payout_id && !selected.withdrawal_assignment_type)
                        : (selected.matched_tx_id == null && selected.consumed_by_tx_id == null)
                    ) && (
                      <button type="button" className="btn-primary btn-sm" onClick={scrollToAssignment}>
                        📌 {t('تعيين', 'Assign')}
                      </button>
                    )}
                    <button className="btn-ghost btn-sm" onClick={closeDetail}>✕</button>
                  </div>
                </div>"""
          if old not in s:
              raise SystemExit("drawer header anchor not found")
          s = s.replace(old, new, 1)

          old = """                  <div className="link-section">
                    <h4>🔗 {t('ربط بمعاملة', 'Link to a transaction')}"""
          new = """                  <div id="sms-assignment-section" className="link-section">
                    <h4>🔗 {t('تعيين SMS بمعاملة', 'Assign SMS to a transaction')}"""
          if old not in s:
              raise SystemExit("incoming assignment section anchor not found")
          s = s.replace(old, new, 1)

          old = """                  <section className="link-section withdrawal-meta-editor">
                    <h4>{t('بيانات السحب التشغيلية', 'Withdrawal operational details')}</h4>"""
          new = """                  <section id="sms-assignment-section" className="link-section withdrawal-meta-editor">
                    <h4>{t('بيانات السحب التشغيلية', 'Withdrawal operational details')}</h4>"""
          if old not in s:
              raise SystemExit("withdrawal assignment section anchor not found")
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/SmsLive.tsx
          git commit -m "Add Assign button to SMS detail drawer"
          git push

      - name: Remove one-time patch workflow
        shell: bash
        run: |
          git rm .github/workflows/patch-sms-assign.yml
          git commit -m "Remove one-time SMS patch workflow"
          git push
